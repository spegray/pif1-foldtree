<svg width="680" viewBox="0 0 680 335" role="img" xmlns="http://www.w3.org/2000/svg"><title>The PIF1/RRM3 duplication mapped onto a time-calibrated fungal tree, on the Saccharomycotina stem roughly 330 to 383 million years ago, with an independent mushroom duplication and the much younger whole-genome duplication</title><desc>A schematic time tree of fungi. A coral circle on the Saccharomycotina stem marks the PIF1/RRM3 duplication at roughly 330–383 Mya (Devonian–Carboniferous), just crown-ward of the budding-yeast common ancestor. A second coral circle on the Agaricomycetes branch marks an independent mushroom duplication. An amber square near 100 Mya on the Saccharomycotina branch marks the Saccharomyces whole-genome duplication, which the PIF1/RRM3 event long predates.</desc>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.dup{fill:#FAECE7;stroke:#993C1D;stroke-width:1.5}
.wgd{fill:#FAEEDA;stroke:#854F0B;stroke-width:1}
.br{fill:none;stroke:#888780;stroke-width:1.5;stroke-linecap:round}
.ax{stroke:#B4B2A9;stroke-width:0.5}
</style>
<g class="br">
<line x1="70" y1="142.5" x2="87" y2="142.5"/><line x1="87" y1="142.5" x2="87" y2="235"/><line x1="87" y1="142.5" x2="145" y2="142.5"/><line x1="87" y1="235" x2="470" y2="235"/>
<line x1="145" y1="110" x2="145" y2="175"/><line x1="145" y1="175" x2="470" y2="175"/><line x1="145" y1="110" x2="178" y2="110"/>
<line x1="178" y1="90" x2="178" y2="130"/><line x1="178" y1="90" x2="470" y2="90"/><line x1="178" y1="130" x2="470" y2="130"/>
</g>
<rect class="wgd" x="398" y="124" width="11" height="11" rx="1"/>
<circle class="dup" cx="238" cy="130" r="8"/>
<circle class="dup" cx="373" cy="235" r="7"/>
<text class="ts" x="238" y="117" text-anchor="middle">PIF1/RRM3</text>
<text class="ts" x="373" y="222" text-anchor="middle">independent</text>
<text class="ts" x="404" y="117" text-anchor="middle">WGD</text>
<text class="t" x="476" y="94">Pezizomycotina</text>
<text class="t" x="476" y="134">Saccharomycotina</text>
<text class="t" x="476" y="179">Taphrinomycotina</text>
<text class="t" x="476" y="239">Agaricomycetes</text>
<g class="ax"><line x1="80" y1="258" x2="470" y2="258"/><line x1="80" y1="255" x2="80" y2="261"/><line x1="210" y1="255" x2="210" y2="261"/><line x1="340" y1="255" x2="340" y2="261"/><line x1="470" y1="255" x2="470" y2="261"/></g>
<text class="ts" x="80" y="274" text-anchor="middle">600</text>
<text class="ts" x="210" y="274" text-anchor="middle">400</text>
<text class="ts" x="340" y="274" text-anchor="middle">200</text>
<text class="ts" x="470" y="274" text-anchor="middle">0</text>
<text class="ts" x="275" y="291" text-anchor="middle">millions of years ago</text>
<circle class="dup" cx="150" cy="312" r="6"/>
<text class="ts" x="162" y="316">gene duplication</text>
<rect class="wgd" x="320" y="306" width="11" height="11" rx="1"/>
<text class="ts" x="338" y="316">Saccharomyces whole-genome duplication</text>
</svg>
